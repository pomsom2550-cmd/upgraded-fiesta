<!DOCTYPE html><html lang="th"><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="UTF-8"><title>วิทยาการคำนวณ ป.5</title><style>
:root{--purple:#6b36bd;--deep:#43217e;--lite:#f5efff;--line:#e4d8fa;--ink:#2c2340}*{box-sizing:border-box}body{margin:0;background:#faf8ff;color:var(--ink);font:16px/1.65 system-ui,'Sarabun',sans-serif}header{background:linear-gradient(115deg,#54249b,#9358dd);color:white;padding:25px max(16px,calc((100vw - 1040px)/2))}h1{font-size:1.5rem;margin:2px 0}h2{font-size:1.23rem;color:var(--deep);margin:0 0 10px}h3{margin:0 0 8px;font-size:1.06rem}.small{font-size:.87rem;color:#716787}header .small{color:#e9dcff}main{max-width:1040px;margin:20px auto;padding:0 14px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;margin:12px 0;box-shadow:0 3px 12px #5128890c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}.tile{border:1px solid var(--line);border-radius:12px;padding:15px;background:white;text-align:left;cursor:pointer}.tile:hover{border-color:#9e78d5;background:#faf6ff}.pill{display:inline-block;color:var(--deep);background:#eadeff;padding:3px 11px;border-radius:50px;font-size:13px}button{cursor:pointer;background:var(--purple);border:0;color:white;border-radius:10px;padding:10px 16px;font-weight:650;font-size:15px;margin:4px 4px 4px 0}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{color:var(--deep);background:#e9dcff}button.outline{color:var(--deep);background:white;border:1px solid #ad8bdc}input,textarea,select{font:inherit;max-width:100%;width:100%;border:1px solid #c9b8e7;padding:9px 11px;border-radius:9px;background:white;color:var(--ink);margin:4px 0 11px}label{display:block;font-weight:600;font-size:.91rem}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.notice{padding:10px 12px;background:#f0e8ff;border-radius:10px;margin:10px 0}.error{background:#ffe9ef;color:#822c48}.ok{background:#e5f7e9;color:#1c6840}.hidden{display:none!important}.question{border-top:1px solid var(--line);padding:13px 0}.choice{display:flex;align-items:flex-start;gap:10px;font-weight:400;cursor:pointer}.choice input{width:auto;margin-top:7px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}th{background:var(--lite)}.scroll{overflow-x:auto}.bar{height:9px;background:#e9dcff;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:var(--purple)}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:13px}.panel{background:var(--lite);border-radius:12px;padding:12px}footer{text-align:center;color:#887d99;padding:30px}@media print{header,nav,.no-print,button{display:none!important}main{max-width:none;margin:0}.card{box-shadow:none;break-inside:avoid}body{background:white}}@media(max-width:600px){header{padding:19px}main{margin:10px auto}.card{padding:14px}}
.role-label{font-weight:700;margin:10px 0 8px}.role-select{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 20px}.role-option{display:flex;align-items:center;justify-content:center;min-height:62px;text-align:center;margin:0;cursor:pointer}.role-option input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.role-option span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:10px 4px;border:2px solid #e1d4f5;border-radius:12px;background:white;color:#4e3375;font-size:14px;line-height:1.4}.role-option input:checked+span{background:#efe4ff;border-color:var(--purple);color:#43217e;box-shadow:0 0 0 1px #6b36bd33}.role-option input:focus-visible+span{outline:3px solid #ae90e4;outline-offset:2px}@media(max-width:430px){.role-option span{font-size:12px;min-height:72px}}</style></head><body><header><div class="row"><div><div class="small">โรงเรียนวัดบึงบ้านสนม · ปีการศึกษา 2569</div><h1>💜 ห้องเรียนวิทยาการคำนวณ ป.5</h1><div>20 ชั่วโมง · Active Learning · ระดับปานกลาง</div></div><div id="identity"></div></div></header><main><div id="flash"></div><section id="loginPage" class="card" style="max-width:490px;margin:30px auto"><h2>เข้าสู่ห้องเรียนออนไลน์</h2><div class="role-label">เลือกประเภทผู้ใช้งาน</div><div class="role-select" role="radiogroup" aria-label="ประเภทผู้ใช้งาน"><label class="role-option"><input type="radio" name="loginRole" value="teacher" checked onchange="updateRole()"><span>👩‍🏫 ครู</span></label><label class="role-option"><input type="radio" name="loginRole" value="student" onchange="updateRole()"><span>🎒 นักเรียน</span></label><label class="role-option"><input type="radio" name="loginRole" value="parent" onchange="updateRole()"><span>👨‍👩‍👧 ผู้ปกครอง</span></label></div><label id="usernameLabel" for="username">ชื่อผู้ใช้ครู</label><input id="username" autocomplete="username" value="teacher" placeholder="teacher"><label id="passwordLabel" for="password">รหัสผ่านครู</label><input id="password" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button id="loginButton" onclick="login()">เข้าสู่ระบบ</button><p id="loginHelp" class="small">ครู: ใช้ teacher และรหัสผ่านที่กำหนดในเมนู Google Sheets</p></section><section id="appPage" class="hidden"><nav class="row card no-print"><div><button class="secondary" onclick="home()">🏠 หน้าแรก</button><button class="secondary" onclick="myReport()">📊 รายงานรายบุคคล</button><button class="secondary hidden" id="teachNav" onclick="teacherPage()">👩‍🏫 จัดการห้องเรียน</button></div><button class="outline" onclick="logout()">ออกจากระบบ</button></nav><div id="content"></div></section></main><footer>พัฒนาเพื่อจัดการเรียนรู้วิทยาการคำนวณ ป.5 · สีม่วง</footer><script>
let token='',state=null,quiz=null,selectedLesson=1;const el=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function alertText(msg,error=false){el('flash').innerHTML='<div class="notice '+(error?'error':'ok')+'">'+esc(msg)+'</div>';window.scrollTo(0,0);}
function req(action,data={}){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(r=>r?.ok?resolve(r.data):reject(new Error(r?.error||'ระบบไม่ตอบสนอง'))).withFailureHandler(e=>reject(new Error(e.message||e))).api(action,data,token);});}
async function run(fn){try{await fn()}catch(e){alertText(e.message,true)}}
function selectedRole(){return document.querySelector('input[name="loginRole"]:checked')?.value||'teacher';}
function updateRole(){const role=selectedRole();const labels={teacher:['ชื่อผู้ใช้ครู','รหัสผ่านครู','teacher','ครู: ใช้ teacher และรหัสผ่านที่กำหนดในเมนู Google Sheets'],student:['รหัสนักเรียน','PIN นักเรียน','เช่น 5001','นักเรียน: ใช้รหัสนักเรียนและ PIN ที่ครูกำหนด'],parent:['รหัสนักเรียนของบุตรหลาน','PIN ผู้ปกครอง','เช่น 5001','ผู้ปกครอง: กรอกรหัสนักเรียนของบุตรหลาน (ระบบเติม P- ให้อัตโนมัติ) และใช้ PIN ผู้ปกครอง']};const o=labels[role];el('usernameLabel').textContent=o[0];el('passwordLabel').textContent=o[1];el('username').placeholder=o[2];el('username').value=role==='teacher'?'teacher':'';el('password').value='';el('loginHelp').textContent=o[3];el('flash').innerHTML='';}
async function login(){await run(async()=>{const role=selectedRole();let username=el('username').value.trim();if(role==='teacher')username='teacher';if(role==='parent'&&username&&!/^P-/i.test(username))username='P-'+username;const button=el('loginButton');button.disabled=true;try{const r=await req('login',{role,username,password:el('password').value});token=r.token;el('password').value='';await refresh();el('loginPage').classList.add('hidden');el('appPage').classList.remove('hidden');el('identity').innerHTML='<span class="pill">'+esc(state.user.name)+' · '+esc({teacher:'ครู',student:'นักเรียน',parent:'ผู้ปกครอง'}[state.user.role]||state.user.role)+'</span>';el('teachNav').classList.toggle('hidden',state.user.role!=='teacher');home();}finally{button.disabled=false;}});}

async function refresh(){state=await req('state');}
async function logout(){try{await req('logout')}catch(e){}token='';state=null;quiz=null;el('appPage').classList.add('hidden');el('loginPage').classList.remove('hidden');el('identity').innerHTML='';el('flash').innerHTML='';}
function latest(arr,lessonId,kind,studentId){return [...arr].reverse().find(x=>x.lessonId===lessonId&&(!kind||x.kind===kind)&&(!studentId||x.studentId===studentId));}
function home(){if(!state)return;if(state.user.role==='teacher'){teacherPage();return;}const id=state.user.studentId;const done=state.results.filter(r=>r.studentId===id&&r.kind==='post').map(x=>x.lessonId);el('content').innerHTML='<div class="card"><h2>บทเรียนออนไลน์ 20 ชั่วโมง</h2><div class="small">เรียนตามลำดับ ทำแบบทดสอบก่อนเรียน ศึกษาเนื้อหา ส่งกิจกรรม และทำแบบทดสอบหลังเรียน</div><div class="bar"><div style="width:'+((new Set(done)).size*5)+'%"></div></div><p>ทำแบบทดสอบหลังเรียนแล้ว '+(new Set(done)).size+'/20 ชั่วโมง</p></div><div class="grid">'+state.lessons.map(l=>'<button class="tile" onclick="openLesson('+l.id+')"><div class="pill">ชั่วโมงที่ '+l.id+' '+(done.includes(l.id)?'✓':'')+'</div><h3>'+esc(l.title)+'</h3><div class="small">'+esc(l.indicator)+'</div></button>').join('')+'</div>';}
function lessonName(id){return state.lessons.find(l=>l.id===id)}
function openLesson(id){if(!state||state.user.role==='teacher')return;selectedLesson=id;const l=lessonName(id),act=latest(state.activities,id,null,state.user.studentId),pre=latest(state.results,id,'pre',state.user.studentId),post=latest(state.results,id,'post',state.user.studentId);el('content').innerHTML='<div class="card"><div class="pill">แผน '+id+'/20 · '+esc(l.indicator)+'</div><h2>'+esc(l.title)+'</h2><div class="panel"><b>จุดประสงค์ K–P–A</b><p>K: '+esc(l.k)+'</p><p>P: '+esc(l.p)+'</p><p>A: '+esc(l.a)+'</p></div><h3>1. ทดสอบก่อนเรียน</h3><p>10 ข้อ · '+(pre?'คะแนนล่าสุด '+pre.score+'/10':'ยังไม่ทำ')+'</p>'+(state.user.role==='student'?'<button onclick="startTest(\'pre\')">เริ่มแบบทดสอบก่อนเรียน</button>':'')+'<hr><h3>2. เนื้อหาและสถานการณ์ปัญหา</h3><p><b>สาระสำคัญ:</b> '+esc(l.title)+' ฝึกวางแผน วิเคราะห์เหตุผล ลงมือทำ ตรวจสอบ และปรับปรุงผลงาน</p><p><b>สถานการณ์:</b> '+esc(l.situation)+'</p><h3>3. Active Learning 5 ขั้น (60 นาที)</h3><ol><li>Engage 5 นาที: คาดการณ์คำตอบจากสถานการณ์</li><li>Explore 15 นาที: สำรวจตัวอย่างและทดลองทำ</li><li>Explain 10 นาที: อธิบายหลักการและอภิปรายคู่</li><li>Elaborate 20 นาที: ทำภารกิจและใบงาน</li><li>Evaluate 10 นาที: สะท้อนผลและทดสอบหลังเรียน</li></ol><div class="panel"><b>กิจกรรม:</b> '+esc(l.task)+'</div><h3>4. ใบกิจกรรมและใบงาน</h3><label>บันทึกขั้นตอนที่ทำ ผลลัพธ์ และปัญหาที่พบ</label><textarea id="activityAnswer" rows="4" '+(state.user.role==='parent'?'readonly':'')+'>'+esc(act?.response||'')+'</textarea><label>ใบงานข้อ 1: '+esc(l.worksheet[0])+'</label><textarea id="worksheet1" rows="2" '+(state.user.role==='parent'?'readonly':'')+'>'+esc(act?.worksheet1||'')+'</textarea><label>ใบงานข้อ 2: '+esc(l.worksheet[1])+'</label><textarea id="worksheet2" rows="2" '+(state.user.role==='parent'?'readonly':'')+'>'+esc(act?.worksheet2||'')+'</textarea>'+(state.user.role==='student'?'<button onclick="saveWork()">บันทึก/ส่งกิจกรรม</button>':'')+'<div class="notice">คะแนนกิจกรรม: '+(act?.score===''||act?.score==null?'รอประเมิน':act.score+'/10')+' · ความเห็นครู: '+esc(act?.feedback||'ยังไม่มี')+'</div><hr><h3>5. ทดสอบหลังเรียน</h3><p>10 ข้อ · '+(post?'คะแนนล่าสุด '+post.score+'/10':'ยังไม่ทำ')+'</p>'+(state.user.role==='student'?'<button onclick="startTest(\'post\')">เริ่มแบบทดสอบหลังเรียน</button>':'')+'</div>';}
async function saveWork(){await run(async()=>{const r=await req('saveActivity',{lessonId:selectedLesson,response:el('activityAnswer').value,worksheet1:el('worksheet1').value,worksheet2:el('worksheet2').value});await refresh();openLesson(selectedLesson);alertText(r.message);});}
async function startTest(kind){await run(async()=>{quiz=await req('startTest',{lessonId:selectedLesson,kind});el('content').innerHTML='<div class="card"><h2>'+(kind==='pre'?'แบบทดสอบก่อนเรียน':'แบบทดสอบหลังเรียน')+' · ชั่วโมงที่ '+selectedLesson+'</h2><p class="small">เลือกคำตอบที่ถูกต้องที่สุดหนึ่งข้อทุกข้อ</p>'+quiz.items.map((q,i)=>'<div class="question"><b>'+q.n+'. '+esc(q.question)+'</b>'+q.options.map((opt,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"><span>'+('กขคง'[j])+'. '+esc(opt)+'</span></label>').join('')+'</div>').join('')+'<button onclick="submitTest()">ส่งคำตอบทั้ง 10 ข้อ</button><button class="outline" onclick="openLesson(selectedLesson)">ยกเลิก</button></div>';window.scrollTo(0,0);});}
async function submitTest(){await run(async()=>{const answers=quiz.items.map((q,i)=>{const chosen=document.querySelector('input[name="q'+i+'"]:checked');return chosen?Number(chosen.value):-1;});if(answers.includes(-1))throw Error('กรุณาตอบให้ครบ 10 ข้อ');const r=await req('submitTest',{attempt:quiz.attempt,answers});quiz=null;await refresh();openLesson(selectedLesson);alertText('ส่งข้อสอบแล้ว ได้ '+r.score+'/'+r.maxScore+' คะแนน');});}
function teacherPage(){if(state.user.role!=='teacher')return;el('content').innerHTML='<div class="card"><h2>แผงควบคุมครูผู้สอน</h2><p>จัดการนักเรียน กำหนดรหัสผ่าน ประเมินกิจกรรม เวลาเรียน สมรรถนะ และคุณลักษณะ</p><div class="two"><div class="panel"><h3>เพิ่มนักเรียน / แก้ไขข้อมูล</h3><label>รหัสนักเรียน</label><input id="sid" placeholder="5001"><label>ชื่อ–สกุล</label><input id="sname"><label>ชั้นเรียน</label><input id="className" value="ป.5"><label>เลขที่</label><input id="snumber"><label>ชื่อผู้ปกครอง</label><input id="parentName"><label>PIN นักเรียน (ใหม่อย่างน้อย 4 ตัว)</label><input id="spin" type="password"><label>PIN ผู้ปกครอง (ใหม่อย่างน้อย 6 ตัว)</label><input id="ppin" type="password"><button onclick="addStudent()">บันทึกข้อมูลนักเรียน</button><p class="small">การแก้ไขนักเรียนเดิม หากเว้น PIN ว่าง ระบบจะคงรหัสเดิมไว้</p></div><div class="panel"><h3>บันทึกผลรายชั่วโมง</h3><label>นักเรียน</label><select id="gradeStudent">'+state.students.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.id+' '+s.name)+'</option>').join('')+'</select><label>แผน</label><select id="gradeLesson">'+state.lessons.map(l=>'<option value="'+l.id+'">'+l.id+'. '+esc(l.title)+'</option>').join('')+'</select><label>คะแนนกิจกรรม (0–10)</label><input id="gradeScore" type="number" min="0" max="10" value="8"><label>เวลาเรียนจริง (นาที 0–120)</label><input id="gradeMinutes" type="number" min="0" max="120" value="60"><label>สมรรถนะ (1–3)</label><select id="gradeComp"><option>3</option><option selected>2</option><option>1</option></select><label>คุณลักษณะ (1–3)</label><select id="gradeAttr"><option>3</option><option selected>2</option><option>1</option></select><label>ความเห็นต่อกิจกรรม</label><textarea id="gradeFeedback" rows="2"></textarea><label>บันทึกเพิ่มเติม</label><textarea id="gradeNote" rows="2"></textarea><button onclick="gradeWork()" '+(!state.students.length?'disabled':'')+'>บันทึกผลการเรียน</button></div></div></div><div class="card"><h2>รายชื่อนักเรียน ('+state.students.length+')</h2><div class="scroll"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>ชั้น</th><th>รายงาน</th></tr></thead><tbody>'+state.students.map(s=>'<tr><td>'+esc(s.id)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.class)+'</td><td><button class="secondary" onclick="showReport(\''+encodeURIComponent(s.id)+'\')">ดูรายงาน</button></td></tr>').join('')+'</tbody></table></div></div>';}
async function addStudent(){await run(async()=>{const r=await req('upsertStudent',{studentId:el('sid').value,name:el('sname').value,className:el('className').value,number:el('snumber').value,parentName:el('parentName').value,pin:el('spin').value,parentPin:el('ppin').value});await refresh();teacherPage();alertText(r.message);});}
async function gradeWork(){await run(async()=>{const r=await req('grade',{studentId:el('gradeStudent').value,lessonId:Number(el('gradeLesson').value),score:Number(el('gradeScore').value),minutes:Number(el('gradeMinutes').value),competency:Number(el('gradeComp').value),attributes:Number(el('gradeAttr').value),feedback:el('gradeFeedback').value,note:el('gradeNote').value});await refresh();teacherPage();alertText(r.message);});}
function myReport(){if(state.user.role==='teacher'){teacherPage();return;}showReport(encodeURIComponent(state.user.studentId));}
async function showReport(encodedId){await run(async()=>{const r=await req('report',{studentId:decodeURIComponent(encodedId)});const s=r.student;const per=r.lessons.map(l=>{const pre=latest(r.results,l.id,'pre',s.id),post=latest(r.results,l.id,'post',s.id),act=latest(r.activities,l.id,null,s.id),a=latest(r.attendance,l.id,null,s.id);return {l,pre,post,act,a};});const post=per.filter(x=>x.post);const total=post.reduce((a,x)=>a+x.post.score,0);el('content').innerHTML='<div class="card"><div class="row"><div><h2>รายงานผลรายบุคคล</h2><p>โรงเรียนวัดบึงบ้านสนม · วิทยาการคำนวณ ป.5 · ปีการศึกษา 2569</p><b>'+esc(s.name)+'</b> · '+esc(s.class)+' · เลขที่ '+esc(s.number)+' · รหัส '+esc(s.id)+'</div><button class="outline no-print" onclick="window.print()">🖨️ พิมพ์ / บันทึก PDF</button></div><div class="notice">หลังเรียนแล้ว '+post.length+'/20 แผน · คะแนนหลังเรียนรวม '+total+'/'+(post.length*10)+' (เฉพาะแผนที่มีผลสอบ)</div><div class="scroll"><table><thead><tr><th>ชม.</th><th>เรื่อง</th><th>ก่อน /10</th><th>หลัง /10</th><th>กิจกรรม /10</th><th>นาที</th><th>สมรรถนะ</th><th>คุณลักษณะ</th></tr></thead><tbody>'+per.map(x=>'<tr><td>'+x.l.id+'</td><td>'+esc(x.l.title)+'</td><td>'+(x.pre?.score??'-')+'</td><td>'+(x.post?.score??'-')+'</td><td>'+(x.act?.score===''?'-':x.act?.score??'-')+'</td><td>'+(x.a?.minutes??'-')+'</td><td>'+esc(x.a?.competency||'-')+'</td><td>'+esc(x.a?.attributes||'-')+'</td></tr>').join('')+'</tbody></table></div><p class="small">เกณฑ์สมรรถนะและคุณลักษณะ: 3 ดี 2 พอใช้ 1 ต้องปรับปรุง · คะแนนกิจกรรมและการเข้าร่วมเรียนบันทึกโดยครู</p></div>';});}
</script></body></html>
